name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yt_downloader_test
          POSTGRES_USER: yt_downloader
          POSTGRES_PASSWORD: yt_downloader
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yt_downloader -d yt_downloader_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: echo "TEST_DATABASE_URL=postgres://yt_downloader:yt_downloader@localhost:5432/yt_downloader_test" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: node-yt-downloader:ci
